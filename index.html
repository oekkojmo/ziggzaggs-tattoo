<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ziggzaggs Tattoo</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
    text-align: center;
  }

  header {
    padding: 20px;
    border-bottom: 1px solid #333;
  }

  header img {
    width: 120px;
    cursor: pointer;
    transition: 0.2s;
  }

  header img:hover {
    transform: scale(1.05);
  }

  #flash-sale {
    display: none;
    padding: 20px;
  }

  #flash-gallery img {
    width: 150px;
    margin: 10px;
    border: 2px solid #333;
  }

  #calendar {
    margin: 40px auto;
    width: 90%;
    max-width: 500px;
    border: 1px solid #333;
    padding: 20px;
  }

  input, select {
    padding: 10px;
    margin: 10px;
    width: 80%;
  }

  button {
    padding: 10px 15px;
    margin: 8px;
    cursor: pointer;
    border: none;
    background: #222;
    color: white;
  }

  button:hover {
    background: #444;
  }

  button:disabled {
    background: #111;
    color: gray;
    cursor: not-allowed;
  }
</style>
</head>

<body>

<header>
  <a href="https://www.instagram.com/ziggzaggstattoo/" target="_blank">
    <img src="logo.png">
  </a>
  <div>ZIGGZAGGS TATTOO</div>
</header>

<div id="flash-sale">
  <h2>🔥 Flash Sale</h2>
  <div id="flash-gallery">
    <img src="flash1.jpg">
    <img src="flash2.jpg">
    <img src="flash3.jpg">
  </div>
</div>

<div id="calendar">
  <h2>Book Appointment</h2>

  <input id="name" placeholder="Your Name">

  <select id="artist">
    <option value="Zigg">Zigg (Main Artist)</option>
  </select>

  <input type="date" id="date">

  <div id="slots"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDeFdpAbImjOBskmax06mPFQOil1m3isZw",
    authDomain: "ziggzaggs-booking.firebaseapp.com",
    projectId: "ziggzaggs-booking"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const slotsDiv = document.getElementById("slots");
  const dateInput = document.getElementById("date");

  dateInput.addEventListener("change", loadSlots);

  async function loadSlots() {
    slotsDiv.innerHTML = "";

    const selectedDate = dateInput.value;
    if (!selectedDate) return;

    const snapshot = await db
      .collection("availability")
      .where("date", "==", selectedDate)
      .get();

    snapshot.forEach(doc => {
      const data = doc.data();

      const btn = document.createElement("button");
      btn.innerText = data.time;

      if (data.taken) {
        btn.disabled = true;
        btn.innerText += " (Booked)";
      } else {
        btn.onclick = async () => {
          const name = document.getElementById("name").value;
          const artist = document.getElementById("artist").value;

          if (!name) {
            alert("Enter your name");
            return;
          }

          await db.collection("bookings").add({
            name: name,
            artist: artist,
            date: selectedDate,
            time: data.time
          });

          await db.collection("availability").doc(doc.id).update({
            taken: true
          });

          alert("Appointment booked!");
          loadSlots();
        };
      }

      slotsDiv.appendChild(btn);
    });
  }

  // Flash toggle
  const flashSaleActive = true;
  if (flashSaleActive) {
    document.getElementById("flash-sale").style.display = "block";
  }
</script>

</body>
</html>
