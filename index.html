<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ziggzaggs Tattoo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0d0d0d;
      color: white;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 2rem;
      border-bottom: 1px solid #333;
    }

    #flash-sale {
      display: none;
      background: red;
      text-align: center;
      padding: 10px;
      font-weight: bold;
    }

    #calendar {
      margin: 40px auto;
      width: 90%;
      max-width: 600px;
      border: 1px solid #444;
      padding: 20px;
      text-align: center;
    }

    .artists {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px;
    }

    .artist {
      border: 1px solid #444;
      padding: 20px;
      cursor: pointer;
    }
  </style>
<div id="calendar">
  <h2>Book an Appointment</h2>
  <div id="slots"></div>
</div>

</head>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDeFdpAbImjOBskmax06mPFQOil1m3isZw",
    authDomain: "ziggzaggs-booking.firebaseapp.com",
    projectId: "ziggzaggs-booking",
    storageBucket: "ziggzaggs-booking.firebasestorage.app",
    messagingSenderId: "234591242411",
    appId: "1:234591242411:web:0048681176d247b2a48fee"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const slotsDiv = document.getElementById("slots");
  const times = ["12:00", "1:00", "2:00", "3:00", "4:00"];

  async function loadSlots() {
    const snapshot = await db.collection("bookings").get();
    const bookedTimes = snapshot.docs.map(doc => doc.data().time);

    times.forEach(time => {
      const btn = document.createElement("button");
      btn.innerText = time;
      btn.style.margin = "10px";

      if (bookedTimes.includes(time)) {
        btn.disabled = true;
        btn.style.background = "#333";
        btn.innerText = time + " (Booked)";
      } else {
        btn.onclick = async () => {
          await db.collection("bookings").add({
            time: time,
            created: new Date()
          });
          alert("Booked " + time);
          location.reload(); // refresh to update UI
        };
      }

      slotsDiv.appendChild(btn);
    });
  }

  loadSlots();
</script>
<body>

<header>
  <img src="logo.png" alt="Ziggzaggs Tattoo Logo" style="width:120px; display:block; margin:0 auto;">
  <div style="margin-top:10px; font-size:1.5rem;">ZIGGZAGGS TATTOO</div>
</header>

<div id="flash-sale">
  🔥 FLASH SALE TODAY – WALK INS WELCOME
</div>

<div id="calendar">
  📅 Booking Calendar Coming Soon
</div>

<div class="artists">
  <div class="artist">Artist 1</div>
  <div class="artist">Artist 2</div>
  <div class="artist">Artist 3</div>
</div>

<script>
  // Toggle flash sale (true = show, false = hide)
  const flashSaleActive = true;

  if (flashSaleActive) {
    document.getElementById("flash-sale").style.display = "block";
  }
</script>

</body>
</html>
