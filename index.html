<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ziggzaggs Tattoo</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
}

header {
  padding: 20px;
  border-bottom: 1px solid #333;
}

header img {
  width: 120px;
  cursor: pointer;
}

#calendar {
  margin: 40px auto;
  width: 90%;
  max-width: 500px;
  border: 1px solid #333;
  padding: 20px;
}

input, select {
  padding: 10px;
  margin: 10px;
  width: 80%;
}

button {
  padding: 10px;
  margin: 6px;
  background: #222;
  color: white;
  border: none;
  cursor: pointer;
}

button:disabled {
  background: #111;
  color: gray;
}

#calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  margin: 20px 0;
}

.day {
  padding: 10px;
  background: #111;
  cursor: pointer;
}

.selected {
  background: #555;
}

#flash-sale {
  display: none;
}

#flash-gallery img {
  width: 120px;
  margin: 5px;
}

/* Mobile */
@media (max-width: 600px) {
  input, select { width: 95%; }
  button { width: 100%; }
}
</style>
</head>

<body>

<header>
  <a href="https://www.instagram.com/ziggzaggstattoo/" target="_blank">
    <img src="logo.png">
  </a>
  <div>ZIGGZAGGS TATTOO</div>
</header>

<div id="flash-sale">
  <h2>🔥 Flash Sale</h2>
  <div id="flash-gallery">
    <img src="flash1.jpg">
    <img src="flash2.jpg">
    <img src="flash3.jpg">
  </div>
</div>

<div id="calendar">
  <h2>Book Appointment</h2>

  <input id="name" placeholder="Your Name">

  <select id="artist">
    <option value="Zigg">Zigg (Main Artist)</option>
  </select>

  <select id="duration">
    <option value="1">1 Hour</option>
    <option value="2">2 Hours</option>
    <option value="3">3 Hours</option>
    <option value="4">4 Hours</option>
  </select>

  <div id="calendar-grid"></div>
  <div id="slots"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDeFdpAbImjOBskmax06mPFQOil1m3isZw",
  authDomain: "ziggzaggs-booking.firebaseapp.com",
  projectId: "ziggzaggs-booking"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const calendarGrid = document.getElementById("calendar-grid");
const slotsDiv = document.getElementById("slots");

let selectedDate = "";

// Generate calendar
function generateCalendar() {
  calendarGrid.innerHTML = "";

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();

  const daysInMonth = new Date(year, month + 1, 0).getDate();

  for (let i = 1; i <= daysInMonth; i++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;

    const div = document.createElement("div");
    div.className = "day";
    div.innerText = i;

    div.onclick = () => {
      selectedDate = dateStr;
      document.querySelectorAll(".day").forEach(d => d.classList.remove("selected"));
      div.classList.add("selected");
      loadSlots();
    };

    calendarGrid.appendChild(div);
  }
}

// Load slots (AUTO GENERATED TIMES)
async function loadSlots() {
  slotsDiv.innerHTML = "";

  if (!selectedDate) return;

  // Default hours (8AM–8PM)
  const times = [];
  for (let i = 8; i <= 20; i++) {
    times.push(`${i}:00`);
  }

  // Get bookings for that date
  const snapshot = await db.collection("bookings")
    .where("date", "==", selectedDate)
    .get();

  let booked = [];

  snapshot.forEach(doc => {
    const data = doc.data();
    const start = parseInt(data.time);
    const duration = data.duration || 1;

    for (let i = 0; i < duration; i++) {
      booked.push(`${start + i}:00`);
    }
  });

  // Build buttons
  times.forEach(time => {
    const btn = document.createElement("button");
    btn.innerText = time;

    if (booked.includes(time)) {
      btn.disabled = true;
      btn.innerText += " (Booked)";
    } else {
      btn.onclick = async () => {
        const name = document.getElementById("name").value;
        const artist = document.getElementById("artist").value;
        const duration = parseInt(document.getElementById("duration").value);

        if (!name) return alert("Enter your name");

        const startHour = parseInt(time);

        // Check availability for full duration
        for (let i = 0; i < duration; i++) {
          if (booked.includes(`${startHour + i}:00`)) {
            return alert("That time range is not available");
          }
        }

        await db.collection("bookings").add({
          name,
          artist,
          date: selectedDate,
          time: time,
          duration: duration
        });

        alert("Booked!");

        window.location.href =
          `mailto:oekkojmo@gmail.com?subject=Tattoo Booking&body=Name:${name}%0D%0ADate:${selectedDate}%0D%0ATime:${time}%0D%0ADuration:${duration}hr`;

        loadSlots();
      };
    }

    slotsDiv.appendChild(btn);
  });
}

// Run calendar
generateCalendar();

// Flash sale toggle
document.getElementById("flash-sale").style.display = "block";
</script>

</body>
</html>
